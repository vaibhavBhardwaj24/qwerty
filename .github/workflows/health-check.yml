name: Health Check

on:
  schedule:
    # Run daily at 00:00 UTC (5:30 AM IST)
    - cron: "0 0 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Main App Health
        id: main-app
        run: |
          echo "Checking main app health..."
          response=$(curl -s -w "\n%{http_code}" ${{ secrets.MAIN_APP_URL }}/api/health)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Code: $http_code"
          echo "Response Body: $body"

          # Check HTTP status code
          if [ "$http_code" -ne 200 ] && [ "$http_code" -ne 503 ]; then
            echo "::error::Main app returned unexpected status $http_code"
            exit 1
          fi

          # Validate JSON response
          if ! echo "$body" | jq empty 2>/dev/null; then
            echo "::error::Main app did not return valid JSON. Response: $body"
            exit 1
          fi

          # Check service status
          status=$(echo "$body" | jq -r '.status')
          postgres=$(echo "$body" | jq -r '.services.postgres.status')
          redis=$(echo "$body" | jq -r '.services.redis.status')

          echo "Overall Status: $status"
          echo "PostgreSQL: $postgres"
          echo "Redis: $redis"

          if [ "$status" = "unhealthy" ]; then
            echo "::error::Main app is unhealthy"
            exit 1
          elif [ "$status" = "degraded" ]; then
            echo "::warning::Main app is degraded (likely Redis is down)"
          fi

      - name: Check WebSocket Server Health
        id: ws-server
        run: |
          echo "Checking WebSocket server health..."
          response=$(curl -s -w "\n%{http_code}" ${{ secrets.WS_SERVER_URL }}/api/all-checks)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Code: $http_code"
          echo "Response Body: $body"

          # Check HTTP status code
          if [ "$http_code" -ne 200 ] && [ "$http_code" -ne 503 ]; then
            echo "::error::WebSocket server returned unexpected status $http_code"
            exit 1
          fi

          # Validate JSON response
          if ! echo "$body" | jq empty 2>/dev/null; then
            echo "::error::WebSocket server did not return valid JSON. Response: $body"
            exit 1
          fi

          # Check service status
          status=$(echo "$body" | jq -r '.status')
          postgres=$(echo "$body" | jq -r '.services.postgres.status')
          redis=$(echo "$body" | jq -r '.services.redis.status')

          echo "Overall Status: $status"
          echo "PostgreSQL: $postgres"
          echo "Redis: $redis"

          if [ "$status" = "unhealthy" ]; then
            echo "::error::WebSocket server is unhealthy"
            exit 1
          elif [ "$status" = "degraded" ]; then
            echo "::warning::WebSocket server is degraded (likely Redis is down)"
          fi

      - name: Report Success
        if: success()
        run: echo "✅ All health checks passed"

      - name: Report Failure
        if: failure()
        run: |
          echo "❌ Health check failed"
          echo "Please check the logs above for details"
